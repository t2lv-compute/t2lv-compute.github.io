<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - GG Development</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="stylesheet" href="/styles.css">
    <style>
        .error-page {
            text-align: center;
            padding-top: 80px;
        }
        .error-code {
            font-size: 6rem;
            font-weight: 700;
            color: var(--muted);
            line-height: 1;
            margin-bottom: 16px;
        }
        .error-message {
            font-size: 1.25rem;
            color: var(--muted);
            margin-bottom: 32px;
        }
        .home-link {
            display: inline-block;
            padding: 10px 24px;
            background: var(--accent-green);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 500;
        }
        .home-link:hover {
            opacity: 0.85;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="error-page">
            <div class="error-code">404</div>
            <p class="error-message">This page doesn't exist.</p>
            <a href="/" class="home-link">Back to Projects</a>
        </div>
    </div>
</body>
</html>
